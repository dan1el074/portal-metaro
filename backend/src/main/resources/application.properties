# Spring
spring.application.name=portal
spring.profiles.active=${APP_PROFILE:dev}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

# OpenAPI / Swagger UI
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# Vídeos / Bunny Stream
bunny.stream.embed-base-url=https://iframe.mediadelivery.net/embed

# FoccoERP
focco.module.step-flow=${FOCCO_MODULE_STEP_FLOW:/FoccoIntegrador/api/v1/Exportacao/portal_pedidos}
focco.module.memorando=${FOCCO_MODULE_MEMORANDO:/FoccoIntegrador/api/v1/Exportacao/portal_order}
focco.module.trello-integration=${FOCCO_MODULE_TRELLO_INTEGRATION:/FoccoIntegrador/api/v1/Exportacao/portal_trello}
focco.module.kanban-lot=${FOCCO_MODULE_KANBAN_LOT:/FoccoIntegrador/api/v1/Exportacao/portal_kanbam_lote}
focco.module.manufacturing-orders=${FOCCO_MODULE_MANUFACTURING_ORDERS:/api/manufatura/v1/OrdensFabricacao}

# Segurança
security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}
security.jwt.duration=${JWT_DURATION:86400}
security.cookie.secure=${AUTH_COOKIE_SECURE:false}
security.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
security.rate-limit.capacity=${RATE_LIMIT_CAPACITY:120}
security.rate-limit.refill-period=${RATE_LIMIT_REFILL_PERIOD:1m}
security.rate-limit.max-clients=${RATE_LIMIT_MAX_CLIENTS:1000}
cors.origins=${CORS_ORIGINS:http://localhost:4200}

# Arquivos
app.server.image-path=${IMAGE_PATH:C:\\workspace\\outros\\imagens}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB

# Outros
app.request.mail.to=${APP_REQUEST_MAIL_TO:ti@metaro.com.br}
