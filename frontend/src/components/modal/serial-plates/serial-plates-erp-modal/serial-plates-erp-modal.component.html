<c-modal id="serialPlateErpModal" alignment="center" backdrop="static" [transition]="true" [keyboard]="false" [visible]="visible" (visibleChange)="visibleChange.emit($event)">
  <c-modal-header><h5 cModalTitle class="confirmation-title"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>Substituir informações pelo ERP?</h5><button cButtonClose aria-label="Cancelar importação" (click)="cancel.emit()"></button></c-modal-header>
  <c-modal-body><p>Existem informações preenchidas em <strong>{{ count }} registro(s)</strong>. Deseja substituí-las pelos dados do pedido?</p><div class="alert alert-warning mb-0">Serão substituídos: cliente, modelo, capacidade, voltagem e peso, inclusive valores preenchidos manualmente.</div></c-modal-body>
  <c-modal-footer><button cButton color="secondary" variant="outline" (click)="cancel.emit()">Cancelar</button><button cButton color="primary" (click)="confirm.emit()">Substituir pelo ERP</button></c-modal-footer>
</c-modal>
