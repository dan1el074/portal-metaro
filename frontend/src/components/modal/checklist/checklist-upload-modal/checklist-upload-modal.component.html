@if (store.uploadState(); as upload) {
  <div class="upload-backdrop" role="dialog" aria-modal="true" aria-labelledby="upload-title">
    <section class="upload-card">
      <h5 id="upload-title">Enviando evidências</h5>
      <p>{{ upload.current }} de {{ upload.total }} · {{ upload.kind === 'video' ? 'Vídeo' : 'Imagem' }}</p>
      <strong>{{ upload.fileName }}</strong>
      <c-progress class="mt-3" [height]="10"><c-progress-bar [value]="upload.progress" /></c-progress>
      <small>{{ upload.progress }}%</small>
      <p class="notice">Aguarde o envio terminar antes de sair desta página.</p>
    </section>
  </div>
}
