<c-modal modalBackNavigation [visible]="visible" (visibleChange)="onVisibleChange($event)" alignment="center" backdrop="static">
  <c-modal-header>
    <h5 cModalTitle>{{ options.title }}</h5>
    <button cButtonClose type="button" [disabled]="busy" aria-label="Fechar" cTooltip="Fechar" cTooltipPlacement="bottom" (click)="cancel()"></button>
  </c-modal-header>
  <c-modal-body>
    <p class="modal-message">{{ options.message }}</p>
    @if (options.inputLabel) {
      <label class="form-label" for="checklist-action-value">{{ options.inputLabel }} @if (options.required) { <span class="text-danger">*</span> }</label>
      <textarea cFormControl id="checklist-action-value" rows="3" [(ngModel)]="value" [placeholder]="options.placeholder || ''"></textarea>
    }
    @if (error) { <p class="text-danger mb-0" role="alert">{{ error }}</p> }
  </c-modal-body>
  <c-modal-footer>
    <button cButton type="button" color="secondary" variant="outline" [disabled]="busy" (click)="cancel()">Cancelar</button>
    <button cButton type="button" [color]="options.danger ? 'danger' : 'primary'" [disabled]="busy || (options.required && !value.trim())" [attr.aria-busy]="busy" (click)="confirm()">
      @if (busy) { <c-spinner size="sm" aria-hidden="true" /> }
      {{ options.confirmLabel || 'Confirmar' }}
    </button>
  </c-modal-footer>
</c-modal>
