<c-sidebar #sidebar1="cSidebar" class="d-print-none sidebar sidebar-fixed border-end" colorScheme="dark" id="sidebar1" visible >
  <c-sidebar-header class="border-bottom">
    <c-sidebar-brand role="link" tabindex="0" (click)="goHome()" (keydown.enter)="goHome()">
      <img src="./assets/images/brand/white-logo.svg" height="26" class="sidebar-brand-full" name="brand" />
      <img src="./assets/images/brand/white-logo-min.svg" height="26" class="sidebar-brand-narrow" name="signet" />
    </c-sidebar-brand>
  </c-sidebar-header>

  <ng-scrollbar orientation="vertical" pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav class="sidebar-nav-tree" [navItems]="navItems" dropdownMode="path" compact />
  </ng-scrollbar>

  @if (!sidebar1.narrow) {
    <c-sidebar-footer cSidebarToggle="sidebar1" class="border-top d-none d-lg-flex" toggle="unfoldable" style="cursor: pointer;">
      <button cSidebarToggler aria-label="Toggle sidebar fold"></button>
    </c-sidebar-footer>
  }
</c-sidebar>

<div class="wrapper d-flex flex-column min-vh-100">
  <app-default-header
    [user]="user"
    [cShadowOnScroll]="'sm'"
    (openModal)="toggleSearchModal(true)"
    sidebarId="sidebar1"
    position="sticky"
    class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
  />
  <div class="body flex-grow-1">
    <router-outlet />
  </div>
  <app-default-footer />
</div>

<app-layout-alert-modal [visible]="showAlertModal" [pendingIssues]="user.pendingIssues" (closeModal)="toggleAlertModal(false)"></app-layout-alert-modal>
<app-layout-search-modal
  [visible]="showSearchModal"
  [roles]="user.roles"
  (closeModal)="toggleSearchModal(false)"
></app-layout-search-modal>
