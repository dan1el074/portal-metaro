<c-container class="h-auto px-4 administration-page record-editor-page" fluid>
  @if (record) {
    <nav class="detail-navigation" aria-label="Navegação da edição"><div class="detail-breadcrumb"><button type="button" class="back-link" (click)="cancel()"><app-checklist-icon name="arrow-left" /> Voltar ao checklist</button><span class="breadcrumb-separator">/</span><strong>Editar checklist</strong></div></nav>
    <main class="editor-content"><header class="editor-heading"><h1>Editar checklist</h1><p>{{ store.snapshot(record).category.name }} · {{ store.snapshot(record).template.name }}</p></header><app-checklist-record-form [record]="record" [flow]="flow" (changed)="changed()" (saveRecord)="save($event)" (cancel)="cancel()" /></main>
  }</c-container
><app-checklist-action-modal />
<app-checklist-upload-modal />
